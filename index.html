<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Store</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; }
        
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            margin: 24px auto;
            border: 1px solid #334155;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: inherit;
        }
        
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1 id="title">مرحباً بك في Sky Store</h1>
    <p id="subtitle">متجر التطبيقات والمشاريع الخاصة بي</p>

    <div class="card">
        <h3 id="appTitle">تطبيق Sky Mod</h3>
        <p id="appDesc">أحدث إصدار من التطبيق مع تحسينات الأداء والواجهة.</p>
        <a href="#" class="btn" id="downloadBtn">تحميل الآن</a>
    </div>

    <script>
        // 1. تحديد النصوص باللغات المختلفة
        const translations = {
            ar: {
                title: "مرحباً بك في Sky Store",
                subtitle: "متجر التطبيقات والمشاريع الخاصة بي",
                appTitle: "تطبيق Sky Mod",
                appDesc: "أحدث إصدار من التطبيق مع تحسينات الأداء والواجهة.",
                downloadBtn: "تحميل الآن",
                dir: "rtl"
            },
            en: {
                title: "Welcome to Sky Store",
                subtitle: "My Official Apps & Projects Store",
                appTitle: "Sky Mod App",
                appDesc: "The latest version of the app with performance and UI improvements.",
                downloadBtn: "Download Now",
                dir: "ltr"
            }
        };

        // 2. معرفة لغة نظام المستخدم/المتصفح
        const userLanguage = navigator.language || navigator.userLanguage;

        // 3. اختبار إذا كانت اللغة تبدأ بـ "ar" (عربي)، وإلا يتم تحويلها إلى الإنجليزية تلقائياً
        const lang = userLanguage.startsWith('ar') ? 'ar' : 'en';

        // 4. تطبيق النصوص واتجاه الصفحة بناءً على اللغة
        document.getElementById('htmlTag').setAttribute('dir', translations[lang].dir);
        document.getElementById('htmlTag').setAttribute('lang', lang);

        document.getElementById('title').innerText = translations[lang].title;
        document.getElementById('subtitle').innerText = translations[lang].subtitle;
        document.getElementById('appTitle').innerText = translations[lang].appTitle;
        document.getElementById('appDesc').innerText = translations[lang].appDesc;
        document.getElementById('downloadBtn').innerText = translations[lang].downloadBtn;
    </script>
</body>
</html>
